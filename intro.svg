<svg width="900" height="260" viewBox="0 0 900 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="900" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1020">
        <animate attributeName="stop-color" values="#0B1020;#10192E;#0B1020" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#111827">
        <animate attributeName="stop-color" values="#111827;#0F172A;#111827" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="accent" x1="120" y1="40" x2="780" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <filter id="blurGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <clipPath id="cardClip">
      <rect x="20" y="20" width="860" height="220" rx="24"/>
    </clipPath>

    <mask id="typingMask">
      <rect x="0" y="0" width="0" height="60" fill="white">
        <animate attributeName="width" values="0;370;370" dur="4s" repeatCount="indefinite"/>
      </rect>
    </mask>
  </defs>

  <!-- background -->
  <rect width="900" height="260" rx="28" fill="url(#bgGrad)"/>

  <!-- animated glows -->
  <g clip-path="url(#cardClip)">
    <circle cx="170" cy="70" r="70" fill="#38BDF8" opacity="0.18" filter="url(#blurGlow)">
      <animate attributeName="cx" values="170;220;170" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="70;90;70" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="190" r="90" fill="#A78BFA" opacity="0.14" filter="url(#blurGlow)">
      <animate attributeName="cx" values="760;700;760" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="190;150;190" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="50" r="60" fill="#34D399" opacity="0.10" filter="url(#blurGlow)">
      <animate attributeName="cx" values="500;540;500" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="50;85;50" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- card -->
  <rect x="20" y="20" width="860" height="220" rx="24" fill="rgba(255,255,255,0.04)" stroke="url(#accent)" stroke-width="1.5"/>
  <rect x="20" y="20" width="860" height="220" rx="24" fill="white" opacity="0.03"/>

  <!-- small terminal dots -->
  <circle cx="52" cy="48" r="5" fill="#FB7185"/>
  <circle cx="70" cy="48" r="5" fill="#FBBF24"/>
  <circle cx="88" cy="48" r="5" fill="#34D399"/>

  <!-- left accent bar -->
  <rect x="48" y="74" width="6" height="110" rx="3" fill="url(#accent)">
    <animate attributeName="height" values="40;110;90;110;40" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- name -->
  <g transform="translate(72, 88)">
    <text x="0" y="0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="white">
      Haruto Ijiri
    </text>

    <g mask="url(#typingMask)">
      <text x="0" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#93C5FD">
        Ph.D. Candidate | Computational Biology × Sleep Neuroscience
      </text>
    </g>

    <!-- blinking cursor -->
    <rect x="374" y="19" width="10" height="20" fill="#93C5FD">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- right info panel -->
  <g transform="translate(72, 142)">
    <text x="0" y="0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#E5E7EB" opacity="0">
      • Sleep neurobiology / EEG dynamics
      <animate attributeName="opacity" values="0;0;1;1" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="0" y="30" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#E5E7EB" opacity="0">
      • Single-cell transcriptomics / AI biology
      <animate attributeName="opacity" values="0;0;0;1;1" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="0" y="60" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#E5E7EB" opacity="0">
      • R / Python / MATLAB / Docker / HPC
      <animate attributeName="opacity" values="0;0;0;0;1;1" dur="8s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- decorative graph lines -->
  <g opacity="0.35">
    <path d="M610 168 C650 120, 700 210, 740 165 S820 125, 850 160" stroke="#38BDF8" stroke-width="2.5" fill="none" stroke-linecap="round">
      <animate attributeName="d"
        values="
          M610 168 C650 120, 700 210, 740 165 S820 125, 850 160;
          M610 180 C650 135, 700 185, 740 150 S820 150, 850 170;
          M610 168 C650 120, 700 210, 740 165 S820 125, 850 160
        "
        dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M610 190 C655 165, 700 220, 750 185 S820 165, 850 190" stroke="#A78BFA" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8">
      <animate attributeName="d"
        values="
          M610 190 C655 165, 700 220, 750 185 S820 165, 850 190;
          M610 175 C655 150, 700 205, 750 175 S820 155, 850 182;
          M610 190 C655 165, 700 220, 750 185 S820 165, 850 190
        "
        dur="5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- footer -->
  <text x="72" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#94A3B8">
    Tsukuba University / RIKEN BDR AI Biology Laboratory
  </text>
</svg>
