<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="392" viewBox="0 0 1000 392" role="img" aria-label="Animated ASCII cat: a cat sits, stretches toward a sleepy friend, then sits again.">
<!-- ASCII cat poses adapted from user-linked r/EmoticonHub post: https://www.reddit.com/r/EmoticonHub/comments/1k14xq8/cat_being_cat_ascii_art/ -->
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1424"/><stop offset="1" stop-color="#101827"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#264d4a" stop-opacity=".58"/><stop offset="1" stop-color="#264d4a" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#7b9d99" opacity=".13"/></pattern>
</defs>
<style>
  .frame {fill:#bcebdc;font-size:18px;font-family:'Noto Sans Mono CJK JP','MS Gothic','Osaka-Mono',monospace;font-weight:400;white-space:pre}
  .idle {animation: idle 7s steps(1,end) infinite;}
  .reach {animation: reach 7s steps(1,end) infinite;opacity:0;}
  @keyframes idle { 0%,22%,73%,100% {opacity:1} 25%,70% {opacity:0} }
  @keyframes reach { 0%,22%,73%,100% {opacity:0} 25%,70% {opacity:1} }
  .breathe {animation: breathe 3s ease-in-out infinite;transform-origin:center;transform-box:fill-box;}
  @keyframes breathe {0%,100%{transform:translateY(1px)}50%{transform:translateY(-2px)}}
  .dot {animation: twinkle 2.4s ease-in-out infinite;}
  @keyframes twinkle {0%,100%{opacity:.25}50%{opacity:1}}
  .blink {animation: blink 7s steps(1,end) infinite;}
  @keyframes blink {0%,94%,100%{opacity:1}95%,97%{opacity:.1}}
  .sleep {animation: snooze 3.3s ease-in-out infinite;}
  @keyframes snooze {0%{transform:translate(0,12px);opacity:0}30%{opacity:.8}100%{transform:translate(18px,-28px);opacity:0}}
  .sleep2 {animation-delay:1.1s}
  .sleep3 {animation-delay:2.2s}
  @media (prefers-reduced-motion:reduce) { .idle,.reach,.breathe,.dot,.blink,.sleep {animation:none!important} .reach{opacity:0}.idle{opacity:1} }
</style>
<rect width="1000" height="392" rx="20" fill="url(#bg)"/>
<rect width="1000" height="392" rx="20" fill="url(#dots)"/>
<ellipse cx="480" cy="220" rx="365" ry="170" fill="url(#halo)"/>
<rect x="22" y="22" width="956" height="348" rx="14" fill="none" stroke="#708d90" stroke-opacity=".22"/>
