  <text class="frame"><tspan x="110" y="107">　　　　　　　　　　 ＿＿</tspan>
<tspan x="110" y="128">　　　　　　　　／＞　　フ</tspan>
<tspan x="110" y="149">　　　　　　　　| 　－　－ l</tspan>
<tspan x="110" y="170">　　　　 　　　／` ミ＿xノ</tspan>
<tspan x="110" y="191">　　　　　 　 /　　　 　 |</tspan>
<tspan x="110" y="212">　　　 　 　 /　 ヽ　　 ﾉ</tspan>
<tspan x="110" y="233">　　 　 ／￣|　　 |　|　|</tspan>
<tspan x="110" y="254">　　　 (￣ヽ＿_ヽ_)__)</tspan></text>
</g>
<g class="breathe-walk f-walk1" transform="translate(34 0)">
  <text class="frame"><tspan x="110" y="107">　　　　　　　　　　 ＿＿</tspan>
<tspan x="110" y="128">　　　　　　　　／＞　　フ</tspan>
<tspan x="110" y="149">　　　　　　　　| 　－　－ l</tspan>
<tspan x="110" y="170">　　　　 　　　／` ミ＿xノ</tspan>
<tspan x="110" y="191">　　　　　 　 /　　　 　 |</tspan>
<tspan x="110" y="212">　　　 　 　 /　 ヽ　　 ﾉ</tspan>
<tspan x="110" y="233">　　 　 　  /　 / |　|　|</tspan>
<tspan x="110" y="254">　　　　　(＿ノ　(＿_)_)</tspan></text>
</g>
<g class="breathe-walk f-walk2" transform="translate(82 0)">
  <text class="frame"><tspan x="110" y="107">　　　　　　　　　　 ＿＿</tspan>
<tspan x="110" y="128">　　　　　　　　／＞　　フ</tspan>
<tspan x="110" y="149">　　　　　　　　| 　－　－ l</tspan>
