<g class="breathe-walk f-return" transform="translate(42 0)">
  <text class="frame"><tspan x="110" y="107">　　　　　　　　　　 ＿＿</tspan>
<tspan x="110" y="128">　　　　　　　　／＞　　フ</tspan>
<tspan x="110" y="149">　　　　　　　　| 　－　－ l</tspan>
