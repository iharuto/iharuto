<g class="small">
  <text x="48" y="356" fill="#8ba9ae" font-size="12">&gt; sleep → wake → walk → donut → return → sleep</text>
  <text x="881" y="356" fill="#65a08b" font-size="11">[loop ∞ breathing on]</text>
  <rect class="cursor" x="398" y="346" width="8" height="13" fill="#a1e9d1"/>
</g>

<g fill="#a6dcc8">
  <circle class="twinkle" cx="877" cy="111" r="1.8"/>
  <circle class="twinkle" cx="915" cy="141" r="1.2" style="animation-delay:1.1s"/>
  <circle class="twinkle" cx="147" cy="317" r="1.5" style="animation-delay:.4s"/>
</g>
</svg>
